name: Deploy production to Cloudflare
on: { workflow_dispatch: {} }
permissions: { contents: read }
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install Wrangler
        run: npm install
        working-directory: production
      - name: Verify JavaScript
        run: npm run check
        working-directory: production
      - name: Configure D1
        run: sed -i "s/REPLACE_WITH_D1_DATABASE_ID/${{ vars.D1_DATABASE_ID }}/" wrangler.jsonc
        working-directory: production
      - name: Apply migrations
        run: npx wrangler d1 migrations apply doctor-village-portal --remote
        working-directory: production
        env:
          CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}"
          CLOUDFLARE_ACCOUNT_ID: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
      - name: Set session secret
        run: printf '%s' "$SESSION_PEPPER" | npx wrangler secret put SESSION_PEPPER
        working-directory: production
        env:
          SESSION_PEPPER: "${{ secrets.SESSION_PEPPER }}"
          CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}"
          CLOUDFLARE_ACCOUNT_ID: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
      - name: Deploy
        run: npx wrangler deploy
        working-directory: production
        env:
          CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}"
          CLOUDFLARE_ACCOUNT_ID: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
